{% extends "base.html" %}

{% block content %}

<form method="post">
  {% csrf_token %}
  {% if error %}<p>{{ error }}</p>{% endif %}
  <!-- Username Entry -->
  <label for="id_username">Username</label>
  <input type="text" id="id_username" name="username" value="{{ form_data.username }}" required>

  <!-- Password Entry -->
  <label for="id_password">Password</label>
  <input type="password" id="id_password" name="password" required>

  <!-- Login Button -->
  <button type="submit">Login</button>
  <br>
  <br>
  <div>
     <a href="{% url 'accounts:register' %}">Create an account</a>
  </div>
</form>
<a href="{% url 'accounts:forgot_password' %}">Forgot your password?</a>
{% endblock %}

<!-- accounts/templates/accounts/login.html, with a <form method="post"> and {% csrf_token %} inside it.
     Without the token, Django rejects the POST with a 403. -->
