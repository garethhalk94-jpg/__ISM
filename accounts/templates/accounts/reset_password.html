{% extends "base.html" %}

{% block title %}Reset Password | CAPITAL ISM{% endblock %}

{% block content %}
<div class="form-page">
    <div class="page-header">
        <p class="eyebrow">ACCOUNT</p>
        <h1>Enter a new password</h1>
    </div>

    <section class="form-card">
        {% if errors %}
            <div class="form-errors" role="alert">
                {% for error in errors %}<p>{{ error }}</p>{% endfor %}
            </div>
        {% endif %}

        <form method="post" class="styled-form">
            {% csrf_token %}

            <div class="form-field">
                <label for="id_password">New password</label>
                <input type="password" id="id_password" name="password"
                       autocomplete="new-password" required autofocus>
            </div>

            <div class="form-field">
                <label for="id_password_confirm">Confirm password</label>
                <input type="password" id="id_password_confirm"
                       name="password_confirm"
                       autocomplete="new-password" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="button button-primary">
                    Change password
                </button>
            </div>
        </form>
    </section>
</div>
{% endblock %}
